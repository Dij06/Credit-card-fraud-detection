name: Keep App Active

on:
  schedule:
    # Run every 14 minutes to prevent inactivity sleep (e.g., Render 15-min spin-down, Streamlit Cloud idle)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Deployed App
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL is not set!"
            echo "To keep your deployed app active, add your app's URL to your GitHub Repository:"
            echo "1. Go to your repo on GitHub: Settings -> Secrets and variables -> Actions"
            echo "2. Under 'Repository variables' (or Secrets), add APP_URL with value e.g. https://<your-app>.streamlit.app"
            exit 1
          fi

          echo "Pinging $APP_URL ..."
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL" || echo "000")
          echo "Response HTTP status: $HTTP_STATUS"

          # Also ping Streamlit's official internal healthcheck endpoint
          HEALTH_URL="${APP_URL%/}/_stcore/health"
          echo "Pinging healthcheck: $HEALTH_URL ..."
          HEALTH_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL" || echo "000")
          echo "Healthcheck response status: $HEALTH_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "App is active and responding successfully!"
          else
            echo "Warning: Received status $HTTP_STATUS. App may be cold-starting or unreachable."
          fi
